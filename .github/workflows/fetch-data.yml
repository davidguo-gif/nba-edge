name: Fetch NBA Data

on:
  schedule:
    # Run daily at 8 AM ET (12 PM UTC during EST / 11 AM UTC during EDT)
    - cron: "0 12 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install nba_api
        run: pip install nba_api

      - name: Fetch NBA data
        run: python scripts/fetch-data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/nbadata.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update NBA data $(date +%Y-%m-%d)"
            git push
          fi